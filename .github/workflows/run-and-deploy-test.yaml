name: Deploy Cloud Functions (test)

on:
  pull_request:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: chatwork-memo-deploy-test

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRPC_VERBOSITY: ERROR  # GRPCのログ出力を抑止

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set up PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"
        extensions: grpc

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Get current directory
      id: current_dir
      run: echo "CURRENT_DIR=$(pwd)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.current_dir.outputs.CURRENT_DIR }}/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    # - name: Cache NPM packages
    #   id: npm-cache
    #   uses: actions/cache@v4
    #   with:
    #     path: ${{ steps.current_dir.outputs.CURRENT_DIR }}/node_modules
    #     key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
    #     restore-keys: |
    #       ${{ runner.os }}-npm-

    - name: Install dependencies (Composer)
      run: composer install --prefer-dist --no-progress

    # - name: Install dependencies (NPM)
    #   run: npm install --prefer-offline --no-audit --progress=false

    - name: Google Cloud認証
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/1035100650942/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        service_account: 'cloud-run-functions-deployer@nobu5-393106.iam.gserviceaccount.com'

    - name: Test with phpunit
      run: bash tests/run_tests.sh

  deploy:
    uses: yananob/myapps-common/.github/workflows/deploy-cloud-functions.yaml@main
    with:
      function_name: 'chatwork-memo-test'
      runtime: 'php84'
      service_account_name: 'cloud-run-functions-deployer'
      wip_pool_name: 'github-actions-pool'
      wip_provider_name: 'github-provider'
      # secrets_config: |-
      #   FIREBASE_SERVICE_ACCOUNT
      # gcs_source_dir: ./public/
      # gcs_bucket_name: chatwork-memo-static
      # gcs_bucket_path: test
      # disable_gcs_cache: true
      deploy_http_trigger: true
      deploy_event_trigger: false
      http_max_instance_count: 1
      memory: '256M'
      http_timeout: '5m'
      event_timeout: '540s'
      environment_variables: |-
        APP_ENV=test
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
